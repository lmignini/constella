[package]
name = "constella"
version = "0.3.0"
edition = "2024"
authors = ["Leonardo Mignini <l.mignini@icloud.com>"]
description = "A no-std bit modulation and demodulation library with const-evaluable constellations"
repository = "https://github.com/lmignini/constella"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["dsp", "modulation", "qam", "qpsk", "no-std"]


[features]
default = []
std = ["rand_distr/std", "num-complex/std", "num-traits/std", "alloc"]
alloc = ["rand_distr/alloc"]
libm = ["dep:libm", "num-traits/libm"]

[dependencies]

# Complex arithmetic without default standard-library features
num-complex = { version = "0.4.*", default-features = false }

# Generic float/integer traits for constellation coordinates (f32, f64, fixed-point)
num-traits = { version = "0.2.*", default-features = false }

# Floating-point math support for `no_std` environments
libm = { version = "0.2.*", optional = true }

# Const square root
trig-const = { version = "0.4.*", default-features = false }

# RNG traits and distributions without standard library
# For channel simulation
rand_core = { version = "0.10.*", default-features = false }
rand_distr = { version = "0.6.*", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.*", features = ["html_reports"] }
rand_xoshiro = { version = "0.8.*", default-features = false }
cpal = "0.15"
ringbuf = "0.4"

libm = "0.2.*"

[[bench]]
name = "modem_throughput"
harness = false

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1
panic = "abort"
